base_url = "https://yuvarajravichandran.com"
title = "Yuvaraj Ravichandran"
description = "Writing stuffs related to software engineering"
theme = "abridge"
default_language = "en"
compile_sass = true
minify_html = true
build_search_index = true
generate_feeds = true
feed_filenames = ["atom.xml"]
generate_sitemap = true
generate_robots_txt = true
taxonomies = [{ name = "tags", feed = true }]

[search]
index_format = "elasticlunr_json"
include_title = true
include_description = true
include_content = true

[markdown.highlighting]
theme = "plastic"
style = "class"
error_on_missing_language = true

[link_checker]
# Python documentation blocks automated requests with HTTP 403 in this environment.
skip_prefixes = ["https://docs.python.org/"]

[extra]
menu = [
  {url = "posts", name = "Posts", slash = true, blank = false},
  {url = "til", name = "TIL", slash = true, blank = false},
  {url = "about", name = "About", slash = true, blank = false},
  {url = "tags", name = "Tags", slash = true, blank = false},
]
menu_footer = [
  {url = "atom.xml", name = "Atom", slash = false, blank = false},
  {url = "archive", name = "Archive", slash = true, blank = false},
]
banner = "banner.png"
author = "Yuvaraj Ravichandran"
seo = true
# Avoid the theme demo's title suffix.
title_addition = ""
footer_credit = true
feed = true
github = "rkyuvraj"
pwa = false
# The prebuilt no-PWA bundle supports Elasticlunr, copy and switching without Node.
js_bundle = true
js_switcher = true
# Match the Sass default; theme.js uses the OS preference before a manual choice.
js_switcher_default = "dark"
js_copycode = true
js_email_encode = false
search_library = "elasticlunr"
stylesheets = ["abridge.css"]
toc = true
# The primary listing already shows recent entries.
recent = false
series = false
# Dates and type are rendered together in the small index override.
meta_index = {position = "bottom", date = false, author = false, readtime = false, updated = false, categories_tags = true}
meta_post = {position = "top", date = true, updated = true, author = false, readtime = true, readstring = "min read", categories_tags = true, divider = "·"}
favicon_svg = "favicon.svg"
favicon180 = "apple-touch-icon.png"
favicon32 = "favicon-32x32.png"
favicon16 = "favicon-16x16.png"
favicon_mask = "safari-pinned-tab.svg"
favicon_mask_color = "#b30"
favicon_theme_color = "#ffffff"
